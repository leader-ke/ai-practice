[project]
name = "ai-practice"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "anthropic",
    "fastapi",
    "uvicorn",
    "pydantic",
    "python-dotenv",
]

[project.optional-dependencies]
retrieval = ["numpy", "sentence-transformers"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes (unused imports, undefined names)
    "I",    # isort (import ordering)
    "B",    # flake8-bugbear (common bugs)
    "S",    # flake8-bandit (security)
    "UP",   # pyupgrade (modern python syntax)
    "SIM",  # flake8-simplify
    "T20",  # flake8-print (flag print statements in non-scripts)
]
ignore = [
    "T201",   # allow print() — these are practice scripts
    "S101",   # allow assert
    "S106",   # allow hardcoded passwords in test data
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"test_*.py" = ["S101"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
